[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klini"
version = "0.2.0"
description = "A self-learning clinical diagnosis agent that runs entirely in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["clinical", "diagnosis", "healthcare", "AI", "LLM", "CLI", "langchain", "self-learning"]
authors = [
  { name = "Ayush-ML" }
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries"
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-cohere>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "tomli-w>=1.0.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/Ayush-ML"
Repository = "https://github.com/Ayush-ML/klini"
Documentation = "https://github.com/Ayush-ML/klini#readme"
Bug_Tracker = "https://github.com/Ayush-ML/klini/issues"

[project.scripts]
klini = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
